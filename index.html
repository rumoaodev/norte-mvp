<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#071216">
<meta name="description" content="Norte — sua rota para empreender sem burocratês">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="norte-icon.png">
<link rel="apple-touch-icon" href="norte-icon.png">
<title>Norte — Sua rota para empreender</title>
<link rel="stylesheet" href="styles.css">
</head>
<body class="dark">
<div class="grid-bg"></div><div class="orb a"></div><div class="orb b"></div>
<main class="app">
<header class="top glass">
<button class="brand" data-view="home" aria-label="Ir para o início">
<img src="norte-mark.png" class="brand-mark" alt="">
<span class="brand-copy"><strong>NORTE</strong><small>Sua rota para empreender.</small></span>
</button>
<button id="theme" class="icon" aria-label="Alternar tema">◐</button>
</header>
<section id="view"></section>
<nav class="nav glass">
<button class="active" data-view="home">⌂<small>Início</small></button>
<button data-view="route">↗<small>Rota</small></button>
<button data-view="tools">⌁<small>Ferramentas</small></button>
<button data-view="company">▦<small>Empresa</small></button>
<button data-view="help">?<small>Ajuda</small></button>
</nav>
</main>

<section id="wizard" class="wizard hidden">
<div class="wizard-shell">
<div class="wizard-top">
<button id="close" class="icon">×</button>
<div class="progress-box"><div><span id="stepText">1 de 10</span><span id="pct">10%</span></div><div class="progress"><i id="bar"></i></div></div>
</div>
<div class="wizard-brand"><img src="norte-mark.png" alt="" /></div>
<div id="question"></div>
</div>
</section>
<div id="toast" class="toast glass"></div>
<script src="app.js"></script>
</body>
</html>
