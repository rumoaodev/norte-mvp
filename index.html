<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b1016">
  <meta name="description" content="Norte — sua rota para empreender. Protótipo MVP.">
  <title>Norte — Sua rota para empreender</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="ambient ambient-a"></div>
  <div class="ambient ambient-b"></div>

  <main class="app-shell">
    <header class="topbar glass">
      <button class="brand" data-view="home" aria-label="Ir para início">
        <span class="brand-mark">N</span>
        <span>
          <strong>Norte</strong>
          <small>Sua rota para empreender.</small>
        </span>
      </button>
      <button id="themeBtn" class="icon-btn" aria-label="Alternar tema" title="Alternar tema">◐</button>
    </header>

    <section id="view" class="view" aria-live="polite"></section>

    <nav class="bottom-nav glass" aria-label="Navegação principal">
      <button data-view="home" class="nav-item active"><span>⌂</span><small>Início</small></button>
      <button data-view="route" class="nav-item"><span>↗</span><small>Rota</small></button>
      <button data-view="tools" class="nav-item"><span>⌁</span><small>Ferramentas</small></button>
      <button data-view="company" class="nav-item"><span>▦</span><small>Empresa</small></button>
      <button data-view="help" class="nav-item"><span>?</span><small>Ajuda</small></button>
    </nav>
  </main>

  <div id="toast" class="toast glass" role="status" aria-live="polite"></div>
  <script src="app.js"></script>
</body>
</html>
