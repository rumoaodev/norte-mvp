<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#061016">
<title>Norte — Sua rota para empreender</title>
<link rel="stylesheet" href="styles.css">
</head>
<body class="dark">
<div class="grid-bg"></div><div class="orb a"></div><div class="orb b"></div>
<main class="app">
<header class="top glass">
<button class="brand" data-view="home"><span>N</span><strong>Norte</strong></button>
<button id="theme" class="icon">◐</button>
</header>
<section id="view"></section>
<nav class="nav glass">
<button class="active" data-view="home">⌂<small>Início</small></button>
<button data-view="route">↗<small>Rota</small></button>
<button data-view="tools">⌁<small>Ferramentas</small></button>
<button data-view="company">▦<small>Empresa</small></button>
<button data-view="help">?<small>Ajuda</small></button>
</nav>
</main>

<section id="wizard" class="wizard hidden">
<div class="wizard-shell">
<div class="wizard-top">
<button id="close" class="icon">×</button>
<div class="progress-box"><div><span id="stepText">1 de 10</span><span id="pct">10%</span></div><div class="progress"><i id="bar"></i></div></div>
</div>
<div id="question"></div>
</div>
</section>
<div id="toast" class="toast glass"></div>
<script src="app.js"></script>
</body>
</html>
